<div class="home-section" id="top">
  <div class="container">
    <div class="home-grid">

      <div class="home-text">
        <p class="home-greeting">
          <span class="terminal-prompt">$</span> whoami<span class="caret">_</span>
        </p>
        <h1 class="profile-name">Léo Randriantahina</h1>
        <h2 class="profile-title">
          <span class="typed-role">Développeur &amp; Data/DevOps Engineer</span>
        </h2>
        <p class="profile-desc">
          Je conçois des pipelines de données, j'automatise des infrastructures et je développe des applications
          de bout en bout. Certifié <span class="tag-inline">Google Associate Cloud Engineer</span>.

        <div class="profile-actions">

        <div class="social-links">
          <a href="https://github.com/Tohiniaina" target="_blank" class="social-link" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://www.linkedin.com/in/l%C3%A9o-randriantahina" target="_blank" class="social-link" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
          <a href="https://www.facebook.com/tohy.randriatahina" target="_blank" class="social-link" aria-label="Facebook">
            <i class="fab fa-facebook-square"></i>
          </a>
        </div>
      </div>

      <div class="home-visual">
        <div class="profile-image-frame">
          <img src="assets/profile.jpg" alt="Photo de Léo Randriantahina" class="profile-image">
          <div class="status-chip">
            <span class="status-dot"></span>
            Ouvert aux opportunités
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
